<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKT48 Ticket Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f1115; color: #ffffff; padding-top: 2rem; padding-bottom: 2rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card-header-custom { background-color: #1a1d24; border-bottom: 1px solid #2d323b; }
        
        /* Grid Card Styles */
        .member-card { background-color: #1a1d24; border-radius: 10px; border: 1px solid #2d323b; height: 100%; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.2s; }
        .member-card:hover { transform: translateY(-3px); }
        .card-header-member { background-color: #21252d; padding: 12px 16px; border-bottom: 1px solid #2d323b; display: flex; justify-content: space-between; align-items: center; }
        
        /* Status Highlight */
        .has-tickets { border-bottom: 4px solid #198754; box-shadow: 0 4px 12px rgba(25, 135, 84, 0.1); }
        .sold-out-item { opacity: 0.65; border-bottom: 4px solid #6c757d; }
        .sold-out-item:hover { opacity: 1; }
        
        /* Favorite Member Styles */
        .special-card { border: 1px solid #ffc107; box-shadow: 0 0 15px rgba(255, 193, 7, 0.15); border-bottom: 4px solid #ffc107; }
        .special-header { background: linear-gradient(145deg, #2a220b 0%, #1a1d24 100%); border-bottom: 1px solid #4a3805; }
        .special-title { color: #ffc107 !important; text-shadow: 0 0 8px rgba(255,193,7,0.4); }

        /* Sesi Tambahan Banner */
        .extra-session-banner { text-align: center; padding: 4px 0; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; }
        .extra-session-banner.eligible { background-color: #dc3545; color: white; border-bottom: 1px solid #a71d2a; }
        .extra-session-banner.maxed { background-color: #343a40; color: #adb5bd; border-bottom: 1px solid #212529; }

        /* Animasi Restock */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .pulse-anim { animation: pulse 1.5s infinite; background-color: #0dcaf0; color: #000; font-weight: bold; border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; margin-left: 8px; }

        .table-dark { --bs-table-bg: transparent; margin-bottom: 0; }
        .table-dark td, .table-dark th { border-color: #2d323b; color: #e1e4e8; padding: 8px 16px; }
        
        .search-box, .form-select { background-color: #1a1d24; border: 1px solid #2d323b; color: white; border-radius: 20px; padding: 10px 20px; }
        .search-box:focus, .form-select:focus { background-color: #242833; border-color: #dc3545; color: white; box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25); }
        .form-select option { background-color: #1a1d24; color: white; }
        
        .btn-custom-active { background-color: #dc3545; color: white; font-weight: 600; border: none; }
        .btn-custom-inactive { background-color: #1a1d24; color: #adb5bd; border: 1px solid #2d323b; }
        .btn-custom-inactive:hover { background-color: #242833; color: white; }
        
        .star-btn { cursor: pointer; transition: transform 0.2s, color 0.2s; user-select: none; }
        .star-btn:hover { transform: scale(1.2); }
    </style>
</head>
<body>

<div class="container-fluid" style="max-width: 1200px;">
    <div class="d-flex align-items-center justify-content-center mb-4 gap-2">
        <h2 class="m-0 fw-bold">🎫 JKT48 & AKB48 Monitor</h2>
    </div>

    <!-- Toggle Kategori -->
    <div class="d-flex justify-content-center gap-2 mb-4">
        <button id="btn-2shot" class="btn btn-custom-active px-4 rounded-pill" onclick="switchCategory('2shot')">📸 2-Shot AKB48</button>
        <button id="btn-mg" class="btn btn-custom-inactive px-4 rounded-pill" onclick="switchCategory('mg')">🤝 Meet & Greet JKT48</button>
    </div>

    <!-- Info Box / Event Banner (Khusus 2-Shot AKB48) -->
    <div id="event-info-container"></div>

    <!-- Info Box Total Kuota -->
    <div class="card card-header-custom border-0 rounded-4 mb-4 shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body text-center">
            <h5 class="text-muted mb-1 fs-6">Total Kuota Tersedia</h5>
            <div class="display-5 fw-bold text-success mb-2" id="total-quota">0</div>
            <small class="text-muted">Update terakhir: <span id="last-update" class="fw-medium text-white">-</span></small>
        </div>
    </div>

    <!-- Banner Announcement (Hanya M&G) -->
    <div id="announcement-container"></div>

    <!-- Kontrol UX: Search, Filter & Sesi Dropdown -->
    <div class="row g-3 mb-4 align-items-center justify-content-center">
        <div class="col-md-4">
            <input type="text" id="searchBox" class="form-control search-box w-100" placeholder="Cari nama member..." onkeyup="applyFilters()">
        </div>
        <div class="col-md-4" id="session-dropdown-wrapper">
            <!-- Dropdown Sesi akan di-render dinamis khusus 2-Shot -->
        </div>
        <div class="col-md-3" id="filter-toggle-container">
            <div class="form-check form-switch d-flex align-items-center gap-2 m-0">
                <input class="form-check-input fs-4 m-0" type="checkbox" role="switch" id="availableOnlyToggle" onchange="applyFilters()">
                <label class="form-check-label text-muted" style="padding-top: 2px;" for="availableOnlyToggle">Hanya Tersedia</label>
            </div>
        </div>
    </div>

    <!-- Data Container (Grid) -->
    <div id="data-container">
        <div class="text-center py-5 text-muted">
            <div class="spinner-border text-danger mb-3" role="status"></div>
            <div>Menyinkronkan data...</div>
        </div>
    </div>
</div>

<!-- Toast Container untuk Notifikasi Restock -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="restockToast" class="toast text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header bg-success text-white border-0">
            <strong class="me-auto">🚨 Restock Alert!</strong>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body fw-medium" id="toastMessage">
            Tiket baru tersedia.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let favoriteMembers = JSON.parse(localStorage.getItem('jkt48_favorites')) || ["Grace Octaviani"];

    let currentCategory = '2shot';
    let fetchInterval;
    let rawData = [];
    let eventDetailData = null;
    let selectedSessionFilter = 'all';
    let lastQuotaState = {}; 
    let recentRestocks = {}; 

    function toggleFavorite(memberName) {
        const index = favoriteMembers.indexOf(memberName);
        if (index > -1) {
            favoriteMembers.splice(index, 1);
        } else {
            favoriteMembers.push(memberName);
        }
        localStorage.setItem('jkt48_favorites', JSON.stringify(favoriteMembers));
        applyFilters(); 
    }

    function switchCategory(category) {
        currentCategory = category;
        const btn2shot = document.getElementById('btn-2shot');
        const btnMg = document.getElementById('btn-mg');
        
        if (category === '2shot') {
            btn2shot.className = 'btn btn-custom-active px-4 rounded-pill';
            btnMg.className = 'btn btn-custom-inactive px-4 rounded-pill';
        } else {
            btn2shot.className = 'btn btn-custom-inactive px-4 rounded-pill';
            btnMg.className = 'btn btn-custom-active px-4 rounded-pill';
        }

        document.getElementById('data-container').innerHTML = `
            <div class="text-center py-5 text-muted">
                <div class="spinner-border text-danger mb-3" role="status"></div>
                <div>Memuat data ${category === '2shot' ? '2-Shot AKB48' : 'Meet & Greet JKT48'}...</div>
            </div>`;
        document.getElementById('announcement-container').innerHTML = '';
        document.getElementById('event-info-container').innerHTML = '';
        document.getElementById('session-dropdown-wrapper').innerHTML = '';
        
        lastQuotaState = {}; 
        selectedSessionFilter = 'all';
        fetchData();
    }

    async function fetchData() {
        const endpoint = currentCategory === '2shot' ? '/api/status' : '/api/mg';
        
        try {
            const response = await fetch(endpoint);
            const resJson = await response.json();
            
            let membersList = [];
            
            if (currentCategory === '2shot') {
                // Mendukung format data statis AKB48 atau dynamic backend
                eventDetailData = resJson.data || resJson;
                if (eventDetailData && eventDetailData.session) {
                    membersList = parseAKB48Sessions(eventDetailData.session);
                } else if (resJson.members) {
                    membersList = resJson.members;
                }
            } else {
                membersList = resJson.members || [];
            }

            // Hitung total kuota secara aman
            let totalQuotaCount = 0;
            membersList.forEach(m => {
                // Konversi boolean quota_available atau hitung angka integer quota
                let q = typeof m.quota === 'number' ? m.quota : (m.quota_available ? 1 : 0);
                totalQuotaCount += q;
            });

            document.getElementById('total-quota').innerText = resJson.total_quota !== undefined ? resJson.total_quota : totalQuotaCount;
            
            if (resJson.last_check) {
                const date = new Date(resJson.last_check * 1000);
                document.getElementById('last-update').innerText = date.toLocaleTimeString('id-ID');
            } else {
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString('id-ID');
            }

            renderEventHeader();
            renderSessionDropdown();

            if (membersList.length === 0) {
                document.getElementById('data-container').innerHTML = '<div class="text-center py-5 text-muted">Data kosong dari server.</div>';
                return;
            }

            processRawData(membersList);
        } catch (error) {
            console.error("Fetch error:", error);
            document.getElementById('data-container').innerHTML = `<div class="text-center py-5 text-danger">Gagal mengambil data: ${error.message}</div>`;
        }
    }

    // Ubah format struktur sesi AKB48 agar kompatibel dengan sistem monitor
    function parseAKB48Sessions(sessionsArray) {
        let flatMembers = [];
        sessionsArray.forEach(sess => {
            if (sess.session_detail) {
                sess.session_detail.forEach(det => {
                    flatMembers.push({
                        name: det.jkt48_member_name,
                        quota: det.quota_available ? 1 : 0,
                        quota_available: det.quota_available,
                        session: `${sess.label} (${sess.start_time.substring(0,5)} - ${sess.end_time.substring(0,5)})`,
                        track: det.label,
                        date: sess.date
                    });
                });
            }
        });
        return flatMembers;
    }

    function renderEventHeader() {
        const headerContainer = document.getElementById('event-info-container');
        if (currentCategory === '2shot' && eventDetailData && eventDetailData.title) {
            let priceFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(eventDetailData.default_price || 200000);
            headerContainer.innerHTML = `
                <div class="card card-header-custom border-secondary mb-4 mx-auto shadow-sm" style="max-width: 800px;">
                    <div class="card-body text-center">
                        <span class="badge bg-danger mb-2 px-3 py-1 rounded-pill">AKB48 Exclusive 2-Shot</span>
                        <h4 class="fw-bold text-white mb-2">${eventDetailData.title}</h4>
                        <p class="text-muted small mb-2">Kode Event: <code>${eventDetailData.code}</code> | Harga: <span class="text-success fw-bold">${priceFormatted}</span></p>
                        <div class="d-flex justify-content-center gap-3 text-white-50 small">
                            <span>📅 Tanggal: ${eventDetailData.session ? eventDetailData.session[0].date : '2026-10-24'}</span>
                            <span>🔒 Max Pembelian: ${eventDetailData.max_purchase} tiket/transaksi</span>
                        </div>
                    </div>
                </div>
            `;
        } else {
            headerContainer.innerHTML = '';
        }
    }

    function renderSessionDropdown() {
        const wrapper = document.getElementById('session-dropdown-wrapper');
        if (currentCategory === '2shot' && eventDetailData && eventDetailData.session) {
            let options = `<option value="all">🌐 Semua Sesi (1 - 8)</option>`;
            eventDetailData.session.forEach((s, index) => {
                options += `<option value="${s.label}">${s.label} (${s.start_time.substring(0,5)} - ${s.end_time.substring(0,5)})</option>`;
            });
            wrapper.innerHTML = `
                <select id="sessionFilterDropdown" class="form-select w-100" onchange="onSessionDropdownChange()">
                    ${options}
                </select>
            `;
        } else {
            wrapper.innerHTML = '';
        }
    }

    function onSessionDropdownChange() {
        selectedSessionFilter = document.getElementById('sessionFilterDropdown').value;
        applyFilters();
    }

    function processRawData(members) {
        const grouped = {};
        const currentQuotaState = {};

        members.forEach(m => {
            if (!grouped[m.name]) {
                grouped[m.name] = { name: m.name, totalQuota: 0, sessions: [] };
            }
            grouped[m.name].sessions.push(m);
            grouped[m.name].totalQuota += m.quota;
        });

        rawData = Object.values(grouped);
        let restockMessages = [];

        rawData.forEach(member => {
            currentQuotaState[member.name] = member.totalQuota;
            
            if (lastQuotaState[member.name] !== undefined && member.totalQuota > lastQuotaState[member.name]) {
                const diff = member.totalQuota - lastQuotaState[member.name];
                restockMessages.push(`<b>${member.name}</b> (+${diff} Tiket)`);
                recentRestocks[member.name] = Date.now();
            }
        });

        if (restockMessages.length > 0) {
            showToast(restockMessages.join('<br>'));
        }
        lastQuotaState = currentQuotaState;

        applyFilters();
    }

    function applyFilters() {
        const searchQuery = document.getElementById('searchBox').value.toLowerCase();
        const showAvailableOnly = document.getElementById('availableOnlyToggle').checked;
        const container = document.getElementById('data-container');
        const announcementContainer = document.getElementById('announcement-container');
        const now = Date.now();

        let eligibleForExtra = [];

        let filteredData = rawData.filter(member => {
            if (currentCategory === 'mg' && member.totalQuota === 0 && member.sessions.length < 4) {
                eligibleForExtra.push(member.name);
            }

            const matchesSearch = member.name.toLowerCase().includes(searchQuery);
            
            // Filter berdasarkan pilihan dropdown sesi jika di kategori 2shot
            let matchesSession = true;
            let displayedSessions = member.sessions;

            if (currentCategory === '2shot' && selectedSessionFilter !== 'all') {
                displayedSessions = member.sessions.filter(s => s.session.includes(selectedSessionFilter));
                matchesSession = displayedSessions.length > 0;
            }

            const activeQuotaCheck = displayedSessions.reduce((acc, s) => acc + s.quota, 0);
            const matchesAvailability = showAvailableOnly ? activeQuotaCheck > 0 : true;

            return matchesSearch && matchesSession && matchesAvailability;
        });

        if (currentCategory === 'mg' && eligibleForExtra.length > 0) {
            announcementContainer.innerHTML = `
                <div class="alert alert-danger mb-4 mx-auto d-flex align-items-center border-0 shadow-sm" style="max-width: 800px; background-color: #2a1114; color: #f8d7da; border: 1px solid #58151c !important;">
                    <div class="fs-2 me-3">📢</div>
                    <div>
                        <strong class="text-danger fw-bold">Member Berpotensi Mendapat Sesi Tambahan:</strong><br>
                        <span style="font-size: 0.9rem;">${eligibleForExtra.join(', ')}</span>
                    </div>
                </div>
            `;
        } else {
            announcementContainer.innerHTML = '';
        }

        filteredData.sort((a, b) => {
            if (a.totalQuota > 0 && b.totalQuota === 0) return -1;
            if (a.totalQuota === 0 && b.totalQuota > 0) return 1;
            return a.name.localeCompare(b.name);
        });

        if (filteredData.length === 0) {
            container.innerHTML = `<div class="text-center py-5 text-muted">Tidak ada member yang cocok dengan pencarian atau filter sesi ini.</div>`;
            return;
        }

        let favoriteHtml = '';
        let regularHtml = '';

        filteredData.forEach(memberData => {
            // Saring sesi sesuai dropdown yang dipilih untuk ditampilkan di kartu
            let sessionsToRender = memberData.sessions;
            if (currentCategory === '2shot' && selectedSessionFilter !== 'all') {
                sessionsToRender = memberData.sessions.filter(s => s.session.includes(selectedSessionFilter));
            }

            const currentFilteredQuota = sessionsToRender.reduce((acc, s) => acc + s.quota, 0);
            const isAvailable = currentFilteredQuota > 0;
            const isFavorite = favoriteMembers.includes(memberData.name);
            
            const isRestocked = recentRestocks[memberData.name] && (now - recentRestocks[memberData.name] < 120000); 
            const restockBadgeHtml = isRestocked ? `<span class="pulse-anim">🔥 RESTOCK</span>` : '';
            
            const itemClass = isAvailable ? 'has-tickets' : 'sold-out-item';
            const specialCardClass = isFavorite && currentCategory === 'mg' ? 'special-card' : '';
            const specialHeaderClass = isFavorite && currentCategory === 'mg' ? 'special-header' : '';
            const specialTitleClass = isFavorite && currentCategory === 'mg' ? 'special-title' : 'text-white';
            
            const starIcon = isFavorite ? '★' : '☆';
            const starColor = isFavorite ? '#ffc107' : '#6c757d';

            const badgeHtml = isAvailable 
                ? `<span class="badge bg-success rounded-pill px-3 py-2 shadow-sm">${currentFilteredQuota} Tersedia</span>` 
                : `<span class="badge bg-secondary rounded-pill px-3 py-2">Sold Out</span>`;

            let extraSessionHtml = '';
            if (currentCategory === 'mg' && memberData.totalQuota === 0) {
                if (memberData.sessions.length < 4) {
                    extraSessionHtml = `<div class="extra-session-banner eligible">🔥 POTENSI SESI TAMBAHAN</div>`;
                } else {
                    extraSessionHtml = `<div class="extra-session-banner maxed">🛑 SOLD OUT (MAX 4 SESI)</div>`;
                }
            }

            let tableRows = '';
            sessionsToRender.forEach(s => {
                const sessionAvailable = s.quota > 0;
                const statusBadge = sessionAvailable 
                    ? `<span class="badge bg-success">${s.quota}</span>` 
                    : `<span class="badge bg-secondary">Habis</span>`;
                
                tableRows += `
                    <tr style="${!sessionAvailable ? 'opacity: 0.4;' : ''}">
                        <td class="text-start">${s.session}</td>
                        <td class="text-center">${s.track}</td>
                        <td class="text-end">${statusBadge}</td>
                    </tr>
                `;
            });

            const starHtml = currentCategory === 'mg' 
                ? `<span class="fs-4 star-btn" style="color: ${starColor};" onclick="toggleFavorite('${memberData.name}')" title="Tandai sebagai Favorit">${starIcon}</span>`
                : '';

            // Tombol Beli Tiket khusus 2-Shot AKB48 mengarah ke link pembelian eksklusif EX5B99 / EXD1A1
            let buyButtonHtml = '';
            if (currentCategory === '2shot' && isAvailable) {
                buyButtonHtml = `
                    <div class="card-footer bg-transparent border-0 px-3 pb-3 pt-0">
                        <a href="https://jkt48.com/purchase/exclusive?code=EX5B99" target="_blank" class="btn btn-success btn-sm w-100 fw-bold rounded-pill shadow-sm">
                            🛒 Beli Tiket AKB48
                        </a>
                    </div>
                `;
            }

            const cardHtml = `
                <div class="col">
                    <div class="member-card ${itemClass} ${specialCardClass}">
                        <div class="card-header-member ${specialHeaderClass}">
                            <div class="d-flex align-items-center gap-2">
                                ${starHtml}
                                <h5 class="m-0 fw-bold ${specialTitleClass} d-flex align-items-center">
                                    ${memberData.name} ${restockBadgeHtml}
                                </h5>
                            </div>
                            ${badgeHtml}
                        </div>
                        ${extraSessionHtml}
                        <div class="card-body p-0 flex-grow-1">
                            <table class="table table-dark table-sm align-middle mb-2" style="font-size: 0.9rem;">
                                <thead class="text-muted border-bottom border-secondary" style="font-size: 0.8rem;">
                                    <tr>
                                        <th class="text-start fw-normal">Sesi</th>
                                        <th class="text-center fw-normal">Jalur</th>
                                        <th class="text-end fw-normal">Stok</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                        ${buyButtonHtml}
                    </div>
                </div>
            `;

            if (isFavorite && currentCategory === 'mg') {
                favoriteHtml += cardHtml;
            } else {
                regularHtml += cardHtml;
            }
        });

        let finalRender = '';
        if (currentCategory === 'mg' && favoriteHtml !== '') {
            finalRender += `
                <div class="col-12 mb-3 mt-2">
                    <h4 class="fw-bold text-warning border-bottom border-warning pb-2 d-inline-block pe-4">⭐ Member Favorit Anda (M&G)</h4>
                </div>
                ${favoriteHtml}`;
            
            if (regularHtml !== '') {
                finalRender += `
                    <div class="col-12 mb-3 mt-5">
                        <h4 class="fw-bold text-white border-bottom border-secondary pb-2 d-inline-block pe-4">👥 Member Lainnya</h4>
                    </div>
                    ${regularHtml}`;
            }
        } else {
            finalRender = regularHtml;
        }

        container.innerHTML = `<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">${finalRender}</div>`;
    }

    function showToast(message) {
        document.getElementById('toastMessage').innerHTML = message;
        const toastEl = document.getElementById('restockToast');
        const toast = new bootstrap.Toast(toastEl, { delay: 5000 });
        toast.show();
    }

    fetchData();
    if (!fetchInterval) {
        fetchInterval = setInterval(fetchData, 15000);
    }
</script>

</body>
</html>
