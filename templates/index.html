<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKT48 2-Shot Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    
    <div class="max-w-7xl mx-auto p-4 md:p-6">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mb-8 sticky top-4 z-10">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-red-500 flex items-center gap-3">
                    🎟️ JKT48 Ticket Monitor
                </h1>
                <p class="text-gray-400 mt-2 text-sm">Pilih nama member untuk langsung membeli tiket</p>
            </div>
            <div class="mt-4 md:mt-0 text-center md:text-right">
                <div class="bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 inline-block">
                    <p class="text-xs text-gray-400">Total Tiket Tersedia</p>
                    <p id="total-quota" class="text-2xl font-bold text-green-400">0</p>
                </div>
                <p class="text-xs text-gray-500 mt-2">Update: <span id="last-update" class="text-gray-300">-</span></p>
            </div>
        </div>

        <!-- Kontainer Utama (Akan diisi per sesi) -->
        <div id="sessions-container" class="space-y-8">
            <div class="flex justify-center items-center h-40">
                <p class="text-gray-400 animate-pulse">Menghubungkan ke API JKT48...</p>
            </div>
        </div>
    </div>

    <script>
        // DAFTAR TARGET KHUSUS & LINK PEMBELIAN
        // Harus disamakan dengan target yang ada di bot.py
        const SPECIAL_TARGETS = ["Michelle Alexandra", "Aurhel Alana", "Grace Octaviani"];
        const BUY_URL = "https://jkt48.com/purchase/exclusive?code=EX5B99";

        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // Update Statistik Header
                document.getElementById('total-quota').innerText = data.total_quota;
                if (data.last_check > 0) {
                    const date = new Date(data.last_check * 1000);
                    document.getElementById('last-update').innerText = date.toLocaleTimeString('id-ID');
                }

                // 1. KELOMPOKKAN DATA BERDASARKAN SESI
                const sessionsObj = {};
                data.members.forEach(member => {
                    const sessionName = member.session || "Sesi Lainnya";
                    if (!sessionsObj[sessionName]) {
                        sessionsObj[sessionName] = [];
                    }
                    sessionsObj[sessionName].push(member);
                });

                // 2. RENDER HTML PER SESI
                const container = document.getElementById('sessions-container');
                let htmlContent = '';

                // Loop setiap sesi yang ada
                for (const [sessionName, membersList] of Object.entries(sessionsObj)) {
                    htmlContent += `
                        <div class="bg-gray-800/40 rounded-xl border border-gray-700/80 overflow-hidden shadow-sm">
                            <div class="bg-gray-700/60 px-5 py-3 border-b border-gray-600/50">
                                <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">
                                    🕒 ${sessionName}
                                </h2>
                            </div>
                            <div class="p-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    `;

                    // Loop member di dalam sesi tersebut
                    membersList.forEach(member => {
                        const isSpecial = SPECIAL_TARGETS.includes(member.name);
                        
                        // TAMPILAN JIKA TIKET TERSEDIA
                        if (member.quota > 0) {
                            const cardBorder = isSpecial ? "border-yellow-400 shadow-[0_0_12px_rgba(250,204,21,0.2)]" : "border-green-500 hover:border-green-400";
                            const nameColor = isSpecial ? "text-yellow-400" : "text-gray-100";
                            const nameIcon = isSpecial ? "🌟 " : "";

                            htmlContent += `
                                <div class="bg-gray-800 rounded-lg p-4 border-l-4 ${cardBorder} transition-all duration-300 hover:bg-gray-750 hover:shadow-lg hover:-translate-y-1 group">
                                    <a href="${BUY_URL}" target="_blank" class="block">
                                        <h3 class="font-bold text-lg ${nameColor} group-hover:underline mb-1">
                                            ${nameIcon}${member.name}
                                        </h3>
                                    </a>
                                    <p class="text-xs text-gray-400 mb-4">Jalur: ${member.track}</p>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm font-semibold bg-green-900/40 text-green-400 px-3 py-1.5 rounded-md">Sisa: ${member.quota}</span>
                                        <a href="${BUY_URL}" target="_blank" class="text-xs text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity">Beli ➔</a>
                                    </div>
                                </div>
                            `;
                        } 
                        // TAMPILAN JIKA SOLD OUT
                        else {
                            const nameIcon = isSpecial ? "🌟 " : "";
                            htmlContent += `
                                <div class="bg-gray-900/50 rounded-lg p-3 border-l-4 border-gray-600 opacity-60 flex justify-between items-center filter grayscale-[50%]">
                                    <div>
                                        <h3 class="font-medium text-sm text-gray-400">${nameIcon}${member.name}</h3>
                                        <p class="text-xs text-gray-500">Jalur: ${member.track}</p>
                                    </div>
                                    <span class="text-xs bg-red-900/30 text-red-400/80 px-2 py-1 rounded">Sold Out</span>
                                </div>
                            `;
                        }
                    });

                    htmlContent += `
                            </div>
                        </div>
                    `;
                }

                if(htmlContent === '') htmlContent = '<p class="text-center text-gray-500">Tidak ada data untuk ditampilkan.</p>';
                container.innerHTML = htmlContent;

            } catch (error) {
                console.error("Gagal mengambil status API:", error);
            }
        }

        // Panggil saat pertama kali dimuat
        fetchStatus();
        // Cek secara background setiap 5 detik
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
