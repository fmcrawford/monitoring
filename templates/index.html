<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKT48 Event Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; padding-top: 2rem; padding-bottom: 2rem; }
        /* Styling tambahan agar Accordion cocok dengan tema gelap */
        .accordion-button { background-color: #2b2b2b !important; color: white !important; box-shadow: none !important; }
        .accordion-button:not(.collapsed) { background-color: #dc3545 !important; color: white !important; }
        .accordion-button::after { filter: invert(1); }
        .table-dark { --bs-table-bg: #1e1e1e; margin-bottom: 0; }
    </style>
</head>
<body>

<div class="container" style="max-width: 800px;">
    <h2 class="text-center mb-4">🎫 JKT48 Ticket Monitor</h2>

    <!-- Tombol Kategori -->
    <div class="d-flex justify-content-center gap-3 mb-4">
        <button id="btn-2shot" class="btn btn-danger active" onclick="switchCategory('2shot')">📸 2-Shot</button>
        <button id="btn-mg" class="btn btn-outline-danger" onclick="switchCategory('mg')">🤝 Meet & Greet</button>
    </div>

    <!-- Info Status -->
    <div class="alert alert-secondary text-center" role="alert">
        Total Kuota Tersedia: <span id="total-quota" class="fw-bold fs-5 text-success">0</span> Tiket <br>
        <small class="text-muted">Pembaruan Terakhir: <span id="last-update">-</span></small>
    </div>

    <!-- Tempat Data Accordion -->
    <div class="accordion" id="data-container">
        <div class="text-center py-4">Memuat data...</div>
    </div>
</div>

<!-- Wajib ditambahkan agar fitur klik (collapse) berfungsi -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentCategory = '2shot';
    let fetchInterval;

    function switchCategory(category) {
        currentCategory = category;
        const btn2shot = document.getElementById('btn-2shot');
        const btnMg = document.getElementById('btn-mg');
        
        if (category === '2shot') {
            btn2shot.className = 'btn btn-danger active';
            btnMg.className = 'btn btn-outline-danger';
        } else {
            btn2shot.className = 'btn btn-outline-danger';
            btnMg.className = 'btn btn-danger active';
        }

        document.getElementById('data-container').innerHTML = '<div class="text-center py-4">Memuat data...</div>';
        fetchData();
    }

    async function fetchData() {
    // Panggil port 5001 untuk 2-Shot, atau port 5002 untuk M&G
    const endpoint = currentCategory === '2shot' 
        ? 'http://localhost:5001/api/status' 
        : 'http://localhost:5002/api/status';
    
    try {
        const response = await fetch(endpoint);
        const data = await response.json();
        renderData(data);
    } catch (error) {
        console.error("Gagal mengambil data dari API:", error);
    }
}    
    async function fetchData() {
        const endpoint = currentCategory === '2shot' ? '/api/status' : '/api/status_mg';
        try {
            const response = await fetch(endpoint);
            const data = await response.json();
            renderData(data);
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('data-container').innerHTML = '<div class="text-center py-4 text-danger">Gagal terhubung ke server.</div>';
        }
    }

    function renderData(data) {
        document.getElementById('total-quota').innerText = data.total_quota || 0;
        if (data.last_check) {
            const date = new Date(data.last_check * 1000);
            document.getElementById('last-update').innerText = date.toLocaleTimeString('id-ID');
        }

        const container = document.getElementById('data-container');
        
        if (!data.members || data.members.length === 0) {
            container.innerHTML = '<div class="text-center py-4">Belum ada data (atau data sedang diproses bot).</div>';
            return;
        }

        // 1. Kelompokkan data berdasarkan Nama Member
        const groupedByMember = {};
        data.members.forEach(m => {
            if (!groupedByMember[m.name]) {
                groupedByMember[m.name] = { totalQuota: 0, sessions: [] };
            }
            groupedByMember[m.name].sessions.push(m);
            groupedByMember[m.name].totalQuota += m.quota;
        });

        // 2. Urutkan nama member sesuai alfabet
        const sortedNames = Object.keys(groupedByMember).sort();

        // 3. Buat HTML untuk Accordion
        let accordionHTML = '';
        sortedNames.forEach((name, index) => {
            const memberData = groupedByMember[name];
            const isAllSoldOut = memberData.totalQuota === 0;
            // Buat ID aman (hapus spasi/simbol) untuk target collapse Bootstrap
            const safeId = name.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');

            const totalBadge = isAllSoldOut 
                ? '<span class="badge bg-secondary ms-auto">Sold Out</span>' 
                : `<span class="badge bg-success ms-auto">${memberData.totalQuota} Tiket</span>`;

            let tableRows = '';
            memberData.sessions.forEach(s => {
                const sessionSoldOut = s.quota === 0;
                const statusBadge = sessionSoldOut ? '<span class="badge bg-secondary">Habis</span>' : `<span class="badge bg-success">${s.quota}</span>`;
                tableRows += `
                    <tr style="${sessionSoldOut ? 'opacity: 0.5;' : ''}">
                        <td>${s.session}</td>
                        <td>${s.track}</td>
                        <td>${statusBadge}</td>
                    </tr>
                `;
            });

            <h2>Status Tiket 2-Shot</h2>
            <div id="twoshot-container"></div> <!-- Ini yang sudah ada -->

            <h2>Status Tiket Meet & Greet</h2>
            <div id="mg-container"></div> <!-- Ini wadah baru untuk M&G -->
            
            accordionHTML += `
                <div class="accordion-item border-secondary" style="background-color: #1e1e1e;">
                    <h2 class="accordion-header" id="heading-${safeId}">
                        <button class="accordion-button collapsed d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${safeId}">
                            <span class="fw-bold fs-6 me-2">${name}</span> 
                            ${totalBadge}
                        </button>
                    </h2>
                    <div id="collapse-${safeId}" class="accordion-collapse collapse" data-bs-parent="#data-container">
                        <div class="accordion-body p-0">
                            <table class="table table-dark table-striped text-center align-middle">
                                <thead>
                                    <tr><th>Sesi</th><th>Jalur</th><th>Ketersediaan</th></tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = accordionHTML;
    }

    fetchData();
    fetchInterval = setInterval(fetchData, 15000);
</script>

</body>
</html>
