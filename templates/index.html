<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKT48 Event Monitor</title>
    <!-- Menggunakan Bootstrap untuk UI yang rapi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #ffffff; padding-top: 2rem; }
        .sold-out { color: #dc3545; font-weight: bold; }
        .available { color: #198754; font-weight: bold; }
        .table-dark { --bs-table-bg: #1e1e1e; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">🎫 JKT48 Ticket Monitor</h2>

    <!-- Tombol Kategori -->
    <div class="d-flex justify-content-center gap-3 mb-4">
        <button id="btn-2shot" class="btn btn-danger active" onclick="switchCategory('2shot')">📸 2-Shot</button>
        <button id="btn-mg" class="btn btn-outline-danger" onclick="switchCategory('mg')">🤝 Meet & Greet</button>
    </div>

    <!-- Info Status -->
    <div class="alert alert-secondary text-center" role="alert">
        Total Kuota Tersedia: <span id="total-quota" class="fw-bold fs-5 text-success">0</span> Tiket <br>
        <small class="text-muted">Pembaruan Terakhir: <span id="last-update">-</span></small>
    </div>

    <!-- Tabel Data -->
    <div class="table-responsive">
        <table class="table table-dark table-striped table-hover align-middle text-center">
            <thead>
                <tr>
                    <th>Nama Member</th>
                    <th>Sesi</th>
                    <th>Jalur</th>
                    <th>Status Kuota</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr><td colspan="4">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let currentCategory = '2shot';
    let fetchInterval;

    // Fungsi untuk ganti kategori saat tombol diklik
    function switchCategory(category) {
        currentCategory = category;
        
        // Ubah tampilan tombol aktif
        const btn2shot = document.getElementById('btn-2shot');
        const btnMg = document.getElementById('btn-mg');
        
        if (category === '2shot') {
            btn2shot.className = 'btn btn-danger active';
            btnMg.className = 'btn btn-outline-danger';
        } else {
            btn2shot.className = 'btn btn-outline-danger';
            btnMg.className = 'btn btn-danger active';
        }

        // Tampilkan loading & ambil data baru
        document.getElementById('table-body').innerHTML = '<tr><td colspan="4">Memuat data...</td></tr>';
        fetchData();
    }

    // Fungsi utama mengambil data dari Backend
    async function fetchData() {
        // Tentukan endpoint berdasarkan kategori yang dipilih
        const endpoint = currentCategory === '2shot' ? '/api/status' : '/api/status_mg';
        
        try {
            const response = await fetch(endpoint);
            const data = await response.json();
            renderTable(data);
        } catch (error) {
            console.error("Gagal mengambil data:", error);
            document.getElementById('table-body').innerHTML = '<tr><td colspan="4" class="text-danger">Gagal terhubung ke server.</td></tr>';
        }
    }

    // Fungsi merender data JSON ke dalam Tabel HTML
    function renderTable(data) {
        // Update Info Header
        document.getElementById('total-quota').innerText = data.total_quota || 0;
        
        if (data.last_check) {
            const date = new Date(data.last_check * 1000);
            document.getElementById('last-update').innerText = date.toLocaleTimeString('id-ID');
        }

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = ''; // Bersihkan tabel

        if (!data.members || data.members.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4">Belum ada data tiket yang dipantau.</td></tr>';
            return;
        }

        // Render seluruh member (baik yang tersedia maupun sold out)
        data.members.forEach(member => {
            const isSoldOut = member.quota === 0;
            
            // Badge indikator (Merah jika Sold Out, Hijau jika tersedia)
            const statusBadge = isSoldOut 
                ? '<span class="badge bg-danger">Sold Out</span>' 
                : `<span class="badge bg-success">${member.quota} Tiket</span>`;

            const row = document.createElement('tr');
            // Jika sold out, beri efek sedikit transparan agar mudah dibedakan
            if (isSoldOut) row.style.opacity = "0.6";

            row.innerHTML = `
                <td class="fw-bold">${member.name}</td>
                <td>${member.session}</td>
                <td>${member.track}</td>
                <td>${statusBadge}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Jalankan fetch pertama kali
    fetchData();
    
    // Auto-refresh setiap 15 detik mengikuti interval bot
    fetchInterval = setInterval(fetchData, 15000);
</script>

</body>
</html>
