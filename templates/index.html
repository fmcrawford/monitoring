    function parseAKB48Sessions(sessionsArray) {
        let flatMembers = [];
        sessionsArray.forEach(sess => {
            if (sess.session_members) {
                sess.session_members.forEach(det => {
                    flatMembers.push({
                        name: det.member_name,
                        quota: det.available_quota, // Mengambil angka asli dari available_quota
                        session: `${sess.label} (${sess.start_time.substring(0,5)} - ${sess.end_time.substring(0,5)})`,
                        track: det.label,
                        date: sess.date
                    });
                });
            }
        });
        return flatMembers;
    }
